<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#28180e"><title>Rose's Chess Club</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#5a3720,#1b130f 80%);color:#f7e9d1;font:16px system-ui,Arial,sans-serif;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:18px}header{text-align:center;margin-bottom:15px}h1{font-family:Georgia,serif;font-size:clamp(27px,6vw,43px);margin:8px 0;color:#f4d5a1}header p{color:#e3c8a4;margin:4px}.panel{background:#2a1b13dd;border:1px solid #795636;border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 8px 24px #0004}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,input{font:inherit;border-radius:8px;padding:12px;border:1px solid #a17b50}button{background:#bd915a;color:#1c120d;font-weight:700;cursor:pointer}button:disabled{opacity:.45}button.secondary{background:#4b3526;color:#fff0d6}input{width:130px;background:#fff5e6;color:#1e140e;text-transform:uppercase}#board{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,560px);aspect-ratio:1;margin:14px auto;border:9px solid #754827;box-shadow:0 12px 32px #0009;border-radius:5px;overflow:hidden}.square{display:grid;place-items:center;position:relative;aspect-ratio:1;padding:0;border:0;border-radius:0;font-size:clamp(27px,7.5vw,58px);font-family:'DejaVu Sans','Segoe UI Symbol',serif;line-height:1;touch-action:manipulation}.light{background:#e7c89a}.dark{background:#96653e}.square.white{color:#fff8e7;text-shadow:0 2px 2px #302015,1px 0 #382b1c,-1px 0 #382b1c}.square.black{color:#221b19;text-shadow:0 1px 1px #d9b484}.square.selected{background:#e6bc50}.square.target:after{content:'';position:absolute;width:25%;height:25%;border-radius:50%;background:#286b41a8;pointer-events:none}.square.last{box-shadow:inset 0 0 0 4px #d8a82b80}.square:focus-visible{outline:4px solid #2a95d6;outline-offset:-4px}#status{font-weight:700;font-size:18px;text-align:center;min-height:26px}.small{font-size:13px;color:#e2c6a5}.room{font-size:21px;letter-spacing:3px;font-weight:800;color:#f4d5a1}.hidden{display:none!important}#moves{max-height:110px;overflow:auto;font-size:14px;line-height:1.8}a{color:#f5d49a;overflow-wrap:anywhere}.footer{text-align:center;color:#c6aa8b;font-size:12px;margin:22px}#promotion button{font-size:25px}#toast{color:#f6c46b;min-height:20px} 
/* Rose's board upgrades */
.wrap{max-width:820px}
#board{width:min(100%,640px);border-width:8px}
.square{
  font-size:clamp(28px,9vw,68px);
  font-family:'DejaVu Sans','Segoe UI Symbol',serif;
}
.square.white{
  color:#fff;
  -webkit-text-stroke:1px #555;
  text-shadow:
    0 -1px 0 #fff,
    1px 1px 0 #bbb,
    2px 2px 0 #888,
    3px 4px 3px #0008;
}
.square.black{
  color:#171717;
  -webkit-text-stroke:1px #080808;
  text-shadow:
    -1px -1px 0 #777,
    1px 1px 0 #000,
    2px 3px 0 #000,
    3px 4px 3px #0009;
}
@keyframes king-check{
  0%,100%{background-color:#b51e27}
  50%{background-color:#f47c7c}
}
.square.in-check{animation:king-check 1.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){
  .square.in-check{animation:none;background:#d83838;outline:4px solid #fff;outline-offset:-4px}
}

/* Muted club colors and clocks */
body{background:radial-gradient(ellipse at top,#45413b,#201f1d 80%);color:#eeeae2}
h1,.room{color:#ded1b8}
header p,.small{color:#c9c1b4}
.panel{background:#2d2b28ee;border-color:#605a50}
button{background:#c4b69c;color:#211f1b;border-color:#8c8272}
button.secondary{background:#48443e;color:#f1ede5}
input{background:#eee9de}
#board{border-color:#686052}
.square.light{background:#ddd8c9}
.square.dark{background:#8d9385}
.square.selected{background:#d1c17e}
.square.last{box-shadow:inset 0 0 0 4px #8d793b88}
.square.target:after{background:#334d45a8}
#toast{color:#e3d2aa}
.footer{color:#aaa396}
.clocks{display:flex;justify-content:center;gap:12px;margin:4px 0 16px}
.clock{
  flex:1;max-width:260px;padding:12px 8px;
  background:#222321;color:#c7c7c0;border:2px solid #5f6259;
  border-radius:10px;text-align:center;
  font:700 clamp(18px,4.8vw,28px) ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
}
.clock.running{background:#e5e3d8;color:#20231f;border-color:#c6ceae}
.clock.low-time{color:#e58e88}
.clock.running.low-time{color:#9d2020}
@keyframes king-check{
  0%,100%{background-color:#ae4242}
  50%{background-color:#d78b83}
}
</style></head><body><div class="wrap"><header><h1>♔ Rose's Chess Club ♚</h1><p>Where every queen deserves her castle</p></header><section class="panel" id="lobby"><div class="actions"><button id="create">Create private game</button><span>or join:</span><input id="code" placeholder="ROOM CODE" maxlength="6" aria-label="Room code"><button id="join">Join game</button></div><p class="small">Share your room code with your opponent. White moves first.</p></section><section class="panel hidden" id="roomPanel"><div class="actions"><span>Room <span class="room" id="roomId"></span></span><button class="secondary" id="copy">Copy invite link</button></div><p class="small" id="identity"></p><p id="toast" role="status"></p></section><section class="panel hidden" id="game"><div class="clocks" aria-label="Game clocks"><div class="clock" id="clock-w">White 30:00</div><div class="clock" id="clock-b">Black 30:00</div></div><div id="status" aria-live="polite"></div><div id="board" role="grid" aria-label="Chessboard"></div><div id="promotion" class="hidden"><p>Promote your pawn to:</p><div class="actions"><button data-p="q">♛ Queen</button><button data-p="r">♜ Rook</button><button data-p="b">♝ Bishop</button><button data-p="n">♞ Knight</button></div></div><div class="actions"><button class="secondary" id="restart">New game</button><button class="secondary" id="resign">Resign</button><span class="small">Tap a piece, then its destination.</span></div><p class="small">Moves</p><div id="moves"></div></section><p class="footer">Made for Robert & Rose • No ads, no accounts</p></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
