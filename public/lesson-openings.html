<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening School | Rose's Chess Academy</title>
<link rel="stylesheet" href="/vendor/cm-chessboard/assets/chessboard.css">
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Georgia,serif;
 background:linear-gradient(135deg,#f3e5cb,#c49a70);
 color:#382419;
}
header{
 background:#493022;
 color:#fff0d5;
 text-align:center;
 padding:25px;
}
main{max-width:950px;margin:auto;padding:20px}
.lesson{
 background:#fff6e8;
 padding:25px;
 border-radius:15px;
 text-align:center;
}
.board{width:min(100%,520px);margin:20px auto}
button{
 background:#70452c;
 color:white;
 padding:12px 20px;
 margin:5px;
 border:0;
 border-radius:8px;
 cursor:pointer;
 font-size:1rem;
}
button:hover{background:#96623e}
button:disabled{opacity:.45;cursor:default}
.panel{
 background:#f1dfb9;
 border:2px solid #a77b43;
 border-radius:12px;
 padding:18px;
 max-width:520px;
 margin:20px auto;
}
#instruction{font-size:1.2rem;min-height:3em}
a{color:#70452c}
</style>
</head>
<body>
<header>
<h1>♔ Opening School ♔</h1>
<p>Rose's Chess Academy</p>
</header>
<main>
<section class="lesson">
<h2>Lesson 2: The Italian Game</h2>
<p>Learn the three golden rules of chess openings.</p>

<div class="panel">
<h3>Our Opening Rules</h3>
<p>1. Control the center.</p>
<p>2. Develop your knights and bishops.</p>
<p>3. Protect your king.</p>
</div>

<div id="openingBoard" class="board"></div>

<div class="panel">
<h3>♟ Your Next Move</h3>
<p id="instruction">Loading your lesson...</p>
<p id="progress">Move 0 of 7</p>
</div>

<button id="nextMove">Show Next Move</button>
<button id="restartOpening">Restart Lesson</button>

<p><a href="academy.html">← Back to the Academy</a></p>
</section>
</main>
<script type="module" src="/lesson-openings.js"></script>
</body>
</html>
